[workspace]
resolver = "2"
members = [
    "crates/tbc-core",
    "crates/tbc-io",
    "crates/tbc-sim",
    "crates/tbc-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/kukkyin/software-tbc"

[workspace.dependencies]
tbc-core = { path = "crates/tbc-core" }
tbc-io = { path = "crates/tbc-io" }
tbc-sim = { path = "crates/tbc-sim" }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
